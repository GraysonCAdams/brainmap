name: build check
# Catches a broken build before it ships, which nothing else here does:
# Cloudflare Pages builds on every push regardless of whether it succeeds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck before build: astro check covers src/, and functions/ needs
      # its own pass because its Cloudflare Workers types replace DOM globals
      # and cannot share the root config.
      - run: npm run check
      - run: npm run build
        env:
          # Public read access only; raises enrich.mjs above the 60 req/hour
          # anonymous GitHub API limit. src/data/private-kb.local.json is
          # gitignored and absent here on purpose; build-kb.mjs handles that.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
