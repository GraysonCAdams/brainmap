name: weekly link check
# Dead external links become a visible issue instead of silent rot.
on:
  schedule:
    - cron: "23 10 * * 1" # Mondays 10:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in content
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200..=299,403,429 "src/content/**/*.md" "src/**/*.astro" "README.md"
          fail: false
      - name: Open issue on failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links found by weekly check"
          content-filepath: ./lychee/out.md
          labels: link-rot
